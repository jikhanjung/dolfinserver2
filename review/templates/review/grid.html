{% load static %}<!doctype html>
<meta charset="utf-8">
<title>finseg 검토</title>
<style>
  :root { --bg:#12161c; --fg:#e8edf3; --dim:#8b97a6; --line:#242c36;
          --fin:#3fb27f; --fluke:#4aa3ff; --rostrum:#c88bff; --other:#e0a63f;
          --head:#ff8ab5; --body:#7f8cff; --bird:#5fd0d8; --pectoral:#9fd356; --person:#d98cff;
          --none:#e05561; --fix:#ffb300; --base:#ffe23c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui,'Noto Sans KR',sans-serif; }
  header { position:sticky; top:0; z-index:10; background:var(--bg);
           border-bottom:1px solid var(--line); padding:9px 16px;
           display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; font-weight:600; }
  .stat { color:var(--dim); font-size:13px; }
  .stat b { color:var(--fg); }
  button { background:#1d242e; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:6px 13px; font:inherit; cursor:pointer; }
  button.primary { background:var(--fin); border-color:var(--fin); color:#06120c;
                   font-weight:600; }
  kbd { background:#1d242e; border:1px solid var(--line); border-radius:4px;
        padding:1px 6px; font-size:12px; }
  #grid { display:grid; gap:10px; padding:14px;
          grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); }
  .tile { position:relative; border-radius:8px; overflow:hidden; aspect-ratio:1;
          border:3px solid var(--fin); background:#000; cursor:crosshair; }
  .tile.sel { outline:2px solid #fff; outline-offset:2px; }
  .tile[data-cls="fluke"]   { border-color:var(--fluke); }
  .tile[data-cls="rostrum"] { border-color:var(--rostrum); }
  .tile[data-cls="head"]    { border-color:var(--head); }
  .tile[data-cls="body"]    { border-color:var(--body); }
  .tile[data-cls="bird"]    { border-color:var(--bird); }
  .tile[data-cls="pectoral"]{ border-color:var(--pectoral); }
  .tile[data-cls="person"] { border-color:var(--person); }
  .tile[data-cls="other"]   { border-color:var(--other); }
  .tile[data-cls="none"]    { border-color:var(--none); }
  .tile[data-cls="none"] img, .tile[data-cls="none"] svg { opacity:.3; }
  /* **`::after` 라야 보인다.** `box-shadow:inset` 은 배경 위·자식 아래에 그려지는데
     `img` 가 타일을 꽉 채우므로 통째로 덮인다 — 값은 바뀌는데 화면은 그대로라
     `x` 가 안 먹는 것처럼 보였다. 자식보다 뒤에 오는 `::after` 로 덮어씌운다 */
  .tile[data-verdict="fix"]::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 0 3px var(--fix); }
  .tile img { width:100%; height:100%; display:block; }
  .tile svg { position:absolute; inset:0; width:100%; height:100%; }
  polygon.mask { fill:rgba(63,178,127,.20); stroke:#4dffb0; stroke-width:2.5;
                 vector-effect:non-scaling-stroke; }
  .tile[data-cls="none"] polygon.mask { fill:none; stroke:#ff8f97; }
  line.base { stroke:var(--base); stroke-width:2.5; vector-effect:non-scaling-stroke; }
  /* 짐작해서 찍은 것이 하나라도 있으면 밑동 선이 빨간 점선이다 */
  .tile[data-partial]:not([data-partial=""]) line.base {
    stroke:#ff6b6b; stroke-dasharray:6 4; }
  /* **집히는 범위는 보이는 점보다 넓다.** 640 뷰박스가 190px 타일로 줄어드니
     배율이 0.29 다 — 뷰박스 r 은 화면에서 그 만큼으로 보인다. 보이는 점(r 11 →
     화면 3px)은 격자를 안 어지럽히는 크기로 두고, 투명한 원(r 34 → 화면 10px)
     으로 집는 자리만 넓힌다. 둘을 갈라 놓지 않으면 점을 키우는 수밖에 없고,
     그러면 점이 밑동을 가려 정작 어디에 찍는지가 안 보인다. */
  g.h { cursor:grab; }
  g.h circle.hit { fill:transparent; stroke:none; pointer-events:all; }
  g.h circle.dot { fill:var(--base); stroke:#000; stroke-width:1.5;
                   vector-effect:non-scaling-stroke; pointer-events:none; }
  g.h:active circle.dot { fill:#fff; }
  /* 앞(머리 쪽)으로 고른 점 */
  g.h.front circle.dot { fill:#ff6fae; stroke:#fff; stroke-width:2; }
  /* 기하 제안은 흐리다 — 사람이 찍은 것과 눈으로 갈려야 한다 */
  g.h.front.guess circle.dot { opacity:.45; stroke-dasharray:3 2; }
  .lab { position:absolute; left:5px; top:5px; padding:1px 7px; border-radius:5px;
         font-size:11px; font-weight:700; background:#000b; }
  .edg { position:absolute; right:5px; top:5px; padding:1px 7px; border-radius:5px;
         font-size:11px; background:#000b; color:#ffd479; }
  .hint { position:absolute; left:5px; bottom:5px; font-size:10px; color:#cfd8e3;
          background:#000b; padding:1px 6px; border-radius:5px; max-width:90%;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* **새 검출기가 낸 상자는 한눈에 갈린다.** 마스크가 없어 윤곽선이 안 그려지는데,
     그것이 "분할이 실패했다" 로 읽히면 안 된다 — 아직 안 딴 것이다 */
  .tile[data-src]:not([data-src="yolov5"]):not([data-src=""]) { border-style:dashed; }
  .src { position:absolute; left:5px; top:5px; font-size:10px; color:#0b0f14;
         background:#cfd8e3; border-radius:3px; padding:0 4px; opacity:.85; }
  .conf { position:absolute; right:5px; bottom:5px; font-size:10px; color:#cfd8e3;
          background:#000b; padding:1px 6px; border-radius:5px; }
  #empty { padding:48px 16px; color:var(--dim); }
  /* **규칙은 늘 떠 있는다.** 화면이 밑동 현이라고 말하지 않으면 검토가
     스스로와 어긋난다 — 문구는 finseg/baseline.py 에 있다 */
  .rule { flex-basis:100%; background:#1b1710; border:1px solid #3a2f14;
          border-left:3px solid var(--base); border-radius:6px;
          padding:6px 11px; font-size:13px; color:#f0dcae; }
  .rule b { color:var(--base); }
  .rule details { display:inline; }
  .rule summary { display:inline; cursor:pointer; color:var(--dim);
                  margin-left:8px; }
  .rule ul { margin:7px 0 2px; padding-left:20px; color:#d9cba9; }
  .rule li { margin:3px 0; }
  /* 손 안 댄 묶음을 Enter 로 넘기려 할 때 뜬다. 규칙줄과 색을 달리해 눈에 걸리게
     한다 — 이것을 못 보고 지나가면 기본값 24장이 판정으로 들어간다 */
  .warn { flex-basis:100%; background:#2a1416; border:1px solid #5c2a2f;
          border-left:3px solid var(--none); border-radius:6px;
          padding:6px 11px; font-size:13px; color:#ffc9cd; }
  /* **저장됐다는 것을 화면이 말한다.** 즉시 저장은 누른 사람에게 아무 자취도
     안 남기므로, 들어갔는지 안 들어갔는지 알 길이 없다 */
  .tile.saved { animation: saved .7s ease-out; }
  @keyframes saved {
    from { box-shadow:0 0 0 3px var(--fin), 0 0 18px 4px var(--fin); }
    to   { box-shadow:0 0 0 3px transparent, 0 0 0 0 transparent; }
  }
  .auto { color:#8fe3bd; }
  .auto b { color:var(--fin); }
  .nav { display:flex; gap:6px; align-items:center; flex-basis:100%; }
  .nav button { padding:4px 10px; }
  .nav select { background:#1d242e; color:var(--fg); border:1px solid var(--line);
                border-radius:6px; padding:4px 8px; font:inherit; }
  .nav select:disabled { opacity:.35; }
  .nav button.on { background:var(--fin); border-color:var(--fin); color:#06120c;
                   font-weight:600; }
  .nav button:disabled { opacity:.35; cursor:default; }
  #menu { position:fixed; z-index:50; min-width:210px; padding:4px;
          background:#1a212b; border:1px solid #33404f; border-radius:8px;
          box-shadow:0 10px 28px #000a; }
  #menu button { display:flex; width:100%; gap:10px; align-items:center;
                 justify-content:space-between; background:none; border:0;
                 border-radius:5px; padding:5px 9px; text-align:left; }
  #menu button:hover { background:#2b3646; }
  #menu kbd { color:var(--dim); }
  #menu hr { border:0; border-top:1px solid var(--line); margin:4px 6px; }
</style>

<header>
  <h1>finseg 검토</h1>
  <span class="stat" id="stat">…</span>
  <span style="flex:1"></span>
  <!-- **안내는 CLASSES 에서 만든다.** 손으로 적어 두면 분류를 늘릴 때 화면만
       옛말을 한다 — 오늘 `e`/`x` 를 못 찾은 것이 그 값이다 -->
  <span class="stat" id="keys"></span>
  <span class="stat auto" id="auto" hidden>고치면 <b>바로 저장</b>된다 ·
    <kbd>Enter</kbd> 다음 페이지</span>
  <button class="primary" id="btnsave" onclick="save(true)">저장하고 다음 (Enter)</button>

  <span class="nav">
    <button id="mtodo" onclick="load({mode:'todo'})">검토할 것</button
    ><button id="mdone" onclick="load({mode:'done'})">검토한 것</button
    ><button id="mstuck" onclick="load({mode:'stuck'})">교정 대기</button
    ><button id="mstale" onclick="load({mode:'stale'})">엔진 바뀜</button
    ><button id="mnew" onclick="load({mode:'new'})">새 검출</button>
    <button id="first" onclick="load({page:1})" title="첫 페이지 (Home)">«</button>
    <button id="prev" onclick="load({page:page-1})">←</button>
    <span id="pg" class="stat">1 / 1</span>
    <button id="next" onclick="load({page:page+1})">→</button>
    <button id="last" onclick="load({page:pages})" title="마지막 페이지 (End)">»</button>
    <select id="clsf" onchange="load({cls:this.value})" title="분류로 거르기">
      <option value="">전체</option>
    </select>
    <span id="nsum" class="stat"></span>
    <kbd>[</kbd><kbd>]</kbd><kbd>Home</kbd><kbd>End</kbd>
  </span>

  <div class="warn" id="warn" hidden></div>

  <div class="rule">
    {{ rule }}
    <details>
      <summary>자세히</summary>
      <ul>
        {% for p in rule_points %}<li>{{ p }}</li>{% endfor %}
      </ul>
    </details>
  </div>
</header>

<div id="grid"></div>
<div id="empty" hidden></div>
<div id="menu" hidden></div>

<script>
const CLASSES = {{ classes|safe }};        // [[key, 한글], …]
const EDGES   = {{ edges|safe }};
const PARTIALS = {{ partials|safe }};   // 밑동 두 점 중 짐작한 것
const FACINGS  = {{ facings|safe }};    // 두 점 중 어느 쪽이 앞(머리 쪽)인가
const CLS_KO = Object.fromEntries(CLASSES), EDG_KO = Object.fromEntries(EDGES);
const CLS_KEYS = CLASSES.map(c => c[0]), EDG_KEYS = EDGES.map(e => e[0]);
// **키는 분류 순서와 따로 온다** (`models.CLASS_KEYS`). 순서는 YOLO 클래스
// 번호라 못 바꾸고, 키는 손에 익는 것이라 사람 쪽 사정으로 정한다
const CLASS_KEYS = {{ class_keys|safe }};
const CLS_BY_KEY = Object.fromEntries(
  CLASSES.map(([k]) => [CLASS_KEYS[k], k]).filter(([key]) => key));
// **날은 골라서 넣는다 — 순환시키지 않는다.** 하나로 순환시키면 목표 값에
// 닿으려고 중간값을 반드시 지나가야 하고, 그 중간값은 판단이 아니라 이동인데도
// 판정으로 저장된다. 시간으로 묶어 가릴 수는 있어도 없앨 수는 없다.
// 값마다 새 키를 외우게 하는 대신 `e` 로 작은 차림표를 띄운다 — 오늘 내내
// 문제였던 "화면이 무엇을 할 수 있는지 안 알려 준다" 도 같이 풀린다.
let tiles = [], hover = null;
// **이 묶음에 손을 댔나.** 아무것도 안 건드린 묶음을 Enter 로 저장하면 기본값
// 24장이 사람의 판정인 척 들어간다 — 실제로 그렇게 24장이 들어간 적이 있다.
let touched = false;
// 마우스가 마지막으로 있던 자리. 격자를 새로 그린 뒤 hover 를 되찾는 데 쓴다
const ptr = {x: -1, y: -1};
addEventListener("pointermove", e => { ptr.x = e.clientX; ptr.y = e.clientY; },
                 {passive: true});

const csrf = () => (document.cookie.match(/csrftoken=([^;]+)/) || [])[1] || "";

document.getElementById("keys").innerHTML =
  CLASSES.map(([k, ko], i) =>
    `<kbd style="border-color:var(--${k})">${CLASS_KEYS[k]}</kbd>${ko}`).join(" ")
  + ` · <kbd>e</kbd>날 <kbd>p</kbd>아래경계 <kbd>f</kbd>앞쪽(모름→왼쪽→오른쪽) <kbd>x</kbd>교정필요`
  + ` · 점을 끌면 밑동 · <kbd>우클릭</kbd>메뉴 · <kbd>Enter</kbd>저장`;

function setHover(d) {
  hover = d || null;
  document.querySelectorAll(".tile.sel").forEach(x => x.classList.remove("sel"));
  if (hover) hover.classList.add("sel");
}

// **일괄 저장과 즉시 저장이 같은 것을 보낸다.** 둘로 갈라 두면 한쪽만 고쳐진다
// **제안도 값이다.** 사람이 안 누르면 기하 제안이 그대로 판정이 된다 —
// `cls`·`edges`·`verdict` 가 기본값으로 저장되는 것과 같다. 밑동 제안을
// 저장하지 않는 것과는 사정이 다르다: 그것은 85%가 틀리지만 이 규칙은
// 문턱 위에서 149/149 였다 (`baseline.propose_facing`).
//
// 나중에 "이게 사람 것이냐 규칙 것이냐" 를 물을 수 있다. 규칙이 결정적이라
// **언제든 다시 계산해 비교할 수 있고**, 값이 갈리는 것은 곧 사람이 규칙을
// 뒤집은 자리다 — 알아야 할 쪽은 그것이라 따로 표를 두지 않는다.
const facingOf = (d, t) => d.dataset.facing || t.facing_hint || "";

function itemOf(d, t) {
  // **여기에 안 실으면 화면만 바뀌고 자료는 안 바뀐다.** 축을 더할 때마다 이
  // 함수와 `sigOf` 를 같이 고쳐야 한다 — 실제로 `base_partial` 을 문자열로
  // 넓히고도 여기를 안 고쳐서 `=== "1"` 이 늘 거짓이 되었고, `facing` 은
  // 아예 빠져 있었다. 둘 다 화면에서는 멀쩡히 바뀌고 저장도 200 을 받는다.
  return { box_id: t.box_id, mask_id: t.mask_id, cls: d.dataset.cls,
           edges: d.dataset.edges, verdict: d.dataset.verdict,
           base_partial: d.dataset.partial || "",
           facing: facingOf(d, t),
           // **이미 사람 것인 교정은 계속 실어 보낸다.** 안 그러면 딴 축만
           // 고쳐 저장할 때 그 교정이 빠진 판정이 쌓여 앞의 것을 덮는다.
           // `*_moved` 는 "이번에 건드렸나" 이고 `*_human` 은 "이미 사람
           // 것인가" 다 — 둘 중 하나면 보낸다
           base: t.base, base_moved: !!t.base_moved || !!t.base_human,
           polygon: t.points,
           polygon_edited: !!t.poly_edited || !!t.poly_human };
}

// **지금 상태를 한 줄로 요약한다.** 마지막으로 저장(또는 불러온) 것과 같으면
// 보내지 않는다 — `e` 를 네 번 눌러 제자리로 돌아오면 바뀐 게 없는데도 판정이
// 네 건 쌓인다. `Review` 가 쌓이는 것은 판단이 바뀐 자취를 남기려는 것이지
// 손가락 움직임을 남기려는 것이 아니다.
const sigOf = (d, t) => JSON.stringify([
  d.dataset.cls, d.dataset.edges, d.dataset.verdict, d.dataset.partial,
  facingOf(d, t),
  t.base_moved ? t.base : null,
  t.poly_edited ? t.points : null,
]);

// **'검토한 것' 에서는 손을 멈추면 저장한다.** 이미 판정이 붙은 것을 고치러
// 온 자리라 "저장하고 다음" 이라는 걸음이 뜻이 없고, 그 단추를 안 누르고
// 페이지를 넘기면 고친 것이 조용히 사라진다.
//
// 묶는 것은 **연타를 한 번으로 줄이려는 것뿐**이다. 예전에는 날(e)이 값을
// 순환해서 중간값이 줄줄이 저장됐고 그것을 시간으로 가리려 했는데, 그건
// 가리는 것이지 없애는 것이 아니었다. 지금은 날도 값마다 키가 있어 중간값
// 자체가 생기지 않는다 — 묶는 시간이 짧아도 된다.
const SETTLE = 800;
const pending = new Map();

// 페이지를 넘기거나 창을 닫을 때는 기다리지 않고 지금 보낸다
function flush() {
  for (const [, p] of pending) { clearTimeout(p.timer); p.run(); }
  pending.clear();
}

function autosave(d, t) {
  const prev = pending.get(t.box_id);
  if (prev) clearTimeout(prev.timer);
  const run = async () => {
    pending.delete(t.box_id);
    const sig = sigOf(d, t);
    if (sig === t.sig) return;      // 바뀐 것이 없다
    let res;
    try {
      res = await fetch("/api/review", {
        method: "POST",
        headers: {"Content-Type": "application/json", "X-CSRFToken": csrf()},
        body: JSON.stringify({items: [itemOf(d, t)]}),
        keepalive: true,     // 창이 닫히는 중에도 이 요청은 끝까지 간다
      });
    } catch (err) { return warn(`저장 실패 — 서버에 닿지 못했다 (${err}).`); }
    if (!res.ok) return warn(`저장 실패 — 서버가 ${res.status} 를 냈다. `
      + `이 칸은 **아직 안 들어갔다.**`);
    const r = await res.json();
    if (r.error) return warn(`저장 실패 — ${r.error}`);
    t.sig = sig;                    // 여기까지가 이제 '들어간 상태' 다
    d.classList.remove("saved");
    void d.offsetWidth;            // 애니메이션을 다시 태우려면 한 번 끊어야 한다
    d.classList.add("saved");
    warn(""); stat();
  };
  pending.set(t.box_id, {run, timer: setTimeout(run, SETTLE)});
}

function warn(msg) {
  const el = document.getElementById("warn");
  el.textContent = msg || "";
  el.hidden = !msg;
}

// **묶음으로 저장하는 모드.** `todo` 는 안 본 것을 처음 판정하는 자리이고,
// `stale` 은 엔진이 바뀌어 판정이 낡은 것을 다시 확인하는 자리다. 둘 다
// **안 누른 것도 판정**이다 — `stale` 에서 그냥 넘기는 것은 "새 마스크도
// 괜찮다" 는 뜻이고, 그렇게 말할 방법이 없으면 그 상자는 영영 대기열에 남는다.
// `new` 는 새 검출기가 낸 상자다. 여기도 묶음 저장이다 — 천 장 넘는 것을 한
// 칸씩 저장하면 못 끝낸다. 다만 **안 누른 것이 "진짜 지느러미다" 라는 뜻이
// 되므로**, 아래 `save()` 의 손 안 댐 경고가 `todo` 와 함께 여기에도 걸린다.
const isBatch = () => mode === "todo" || mode === "stale" || mode === "new";

// `todo` 는 아직 안 본 것, `done` 은 **본 순서대로** 이미 본 것.
// 되짚어 보는 길이 있어야 첫 페이지와 열 번째 페이지의 기준이 같은지 알 수 있다
let mode = "todo", page = 1, pages = 1, total = 0, clsFilter = "";

async function load(opts = {}) {
  flush();   // 넘기기 전에 기다리는 저장을 먼저 보낸다
  if (opts.mode && opts.mode !== mode) { mode = opts.mode; page = 1; }
  // 거르는 값이 바뀌면 첫 쪽으로 — 3쪽에서 걸렀는데 3쪽이 없을 수 있다
  if (opts.cls !== undefined && opts.cls !== clsFilter) {
    clsFilter = opts.cls; page = 1;
  }
  if (opts.page) page = Math.max(opts.page, 1);
  const r = await fetch(`/api/batch?n=24&mode=${mode}&page=${page}`
                        + `&cls=${encodeURIComponent(clsFilter)}`)
    .then(r => r.json());
  tiles = r.tiles;
  mode = r.mode; page = r.page; pages = r.pages; total = r.total;
  clsFilter = r.cls || "";
  touched = false; warn("");
  const g = document.getElementById("grid");
  g.innerHTML = "";
  const empty = document.getElementById("empty");
  empty.hidden = tiles.length > 0;
  if (!tiles.length)
    empty.textContent = mode === "new"
      ? "새 검출기가 들인 상자가 없다. manage.py infer_boxes 로 들이고 "
        + "manage.py crops 로 잘라 둘 것 — 크롭이 없으면 여기 안 뜬다."
      : "검토할 것이 없다. 마스크가 없으면 manage.py segment 를 먼저 돌릴 것.";
  for (const t of tiles) {
    const d = document.createElement("div");
    d.className = "tile";
    d.dataset.box = t.box_id;
    d.dataset.cls = t.cls; d.dataset.edges = t.edges;
    d.dataset.verdict = t.verdict; d.dataset.partial = t.base_partial || "";
    d.dataset.facing = t.facing || "";
    // **어느 검출기가 낸 상자인지 칸이 말한다.** 옛 상자는 "이 윤곽이 맞나",
    // 새 상자는 "여기 정말 지느러미가 있나" 라 누르는 손이 다르다
    d.dataset.src = t.source || "";
    d.innerHTML =
      `<img src="${t.crop}" loading="lazy" alt="">
       <svg viewBox="0 0 ${t.size} ${t.size}" preserveAspectRatio="none">
         <polygon class="mask"></polygon>
         <line class="base"></line>
         <g class="h" data-i="0"><circle class="hit" r="34"></circle>
                                 <circle class="dot" r="11"></circle></g>
         <g class="h" data-i="1"><circle class="hit" r="34"></circle>
                                 <circle class="dot" r="11"></circle></g>
       </svg>
       <span class="lab"></span><span class="edg"></span>
       ${t.hint ? `<span class="hint">${t.hint}</span>` : ""}
       ${t.conf != null ? `<span class="conf">${t.conf.toFixed(2)}</span>` : ""}
       ${t.source && t.source !== "yolov5"
           ? `<span class="src">${t.source}</span>` : ""}`;
    d.onmouseenter = () => setHover(d);
    d.oncontextmenu = ev => {
      ev.preventDefault(); setHover(d); showMenu(d, t, ev.clientX, ev.clientY);
    };
    g.appendChild(d);
    draw(d, t);
    drag(d, t);
    t.sig = sigOf(d, t);   // 들어와 있는 판정이 기준선이다
  }
  // **격자를 새로 그렸으니 hover 를 되찾는다.** 안 하면 hover 가 사라진 옛 타일을
  // 가리킨 채로 남아, 마우스를 움직이기 전까지 모든 키가 조용히 죽는다 —
  // mouseenter 는 마우스가 실제로 움직여야 다시 나기 때문이다.
  setHover(document.elementFromPoint(ptr.x, ptr.y)?.closest(".tile"));
  nav();
  stat();
}

function nav() {
  const sel = document.getElementById("clsf");
  if (!sel.dataset.built) {
    sel.innerHTML = `<option value="">전체</option>` +
      CLASSES.map(([k, ko]) => `<option value="${k}">${ko}</option>`).join("");
    sel.dataset.built = "1";
  }
  sel.value = clsFilter;
  // 거르기는 '검토한 것' 에서만 뜻이 있다 — 나머지는 이미 좁혀진 목록이다
  sel.disabled = mode !== "done";
  document.getElementById("mtodo").classList.toggle("on", mode === "todo");
  document.getElementById("mdone").classList.toggle("on", mode === "done");
  document.getElementById("mstuck").classList.toggle("on", mode === "stuck");
  document.getElementById("mstale").classList.toggle("on", mode === "stale");
  document.getElementById("mnew").classList.toggle("on", mode === "new");
  document.getElementById("pg").textContent = `${page} / ${pages}`;
  document.getElementById("first").disabled = page <= 1;
  document.getElementById("prev").disabled = page <= 1;
  document.getElementById("next").disabled = page >= pages;
  document.getElementById("last").disabled = page >= pages;
  // 'todo' 가 아니면 저장이 자동이라 이 단추가 할 일이 없다
  document.getElementById("btnsave").hidden = !isBatch();
  document.getElementById("auto").hidden = isBatch();
  document.getElementById("btnsave").textContent =
    mode === "stale" ? "확인하고 다음 (Enter)" : "저장하고 다음 (Enter)";
  document.getElementById("nsum").textContent =
    mode === "done" ? `검토한 것 ${total.toLocaleString()}`
    : mode === "stuck" ? `교정 대기 ${total.toLocaleString()}`
    : mode === "stale" ? `엔진 바뀜 ${total.toLocaleString()}`
    : mode === "new" ? `새 검출 ${total.toLocaleString()} (확신 높은 것부터)`
    : `남은 것 ${total.toLocaleString()}`;
}

// **자르기는 미리보기다.** 실제 자료는 서버가 래스터로 자른다(finseg.baseline);
// 여기서는 반평면 클리핑으로 같은 모양을 대충 보여 준다.
function clip(pts, a, b) {
  if (!pts.length || !a || !b) return pts;
  const side = p => (b[0]-a[0]) * (p[1]-a[1]) - (b[1]-a[1]) * (p[0]-a[0]);
  const keep = p => side(p) <= 0;
  const cross = (p, q) => {
    const s1 = side(p), s2 = side(q), t = s1 / (s1 - s2);
    return [p[0] + t*(q[0]-p[0]), p[1] + t*(q[1]-p[1])];
  };
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i+1) % pts.length];
    if (keep(p)) { out.push(p); if (!keep(q)) out.push(cross(p, q)); }
    else if (keep(q)) out.push(cross(p, q));
  }
  return out.length >= 3 ? out : pts;
}

function draw(d, t) {
  const svg = d.querySelector("svg");
  const [a, b] = t.base;
  // 밑동 현은 등지느러미에만 뜻이 있다 — 꼬리·주둥이에는 긋지 않는다
  const isFin = d.dataset.cls === "fin";
  const shown = isFin ? clip(t.points, a, b) : t.points;
  svg.querySelector("polygon").setAttribute("points",
    shown.map(p => p.join(",")).join(" "));
  const line = svg.querySelector("line");
  line.style.display = isFin ? "" : "none";
  line.setAttribute("x1", a[0]); line.setAttribute("y1", a[1]);
  line.setAttribute("x2", b[0]); line.setAttribute("y2", b[1]);
  // 자리는 <g> 를 옮겨서 준다 — 안의 두 원(보이는 점·집히는 범위)이 늘 같이 간다
  // 앞(머리 쪽)으로 고른 점은 색이 다르다. 저장된 두 점은 왼쪽·오른쪽일 뿐이라
  // **화면이 어느 쪽을 앞으로 아는지 보여 주지 않으면 사람이 확인할 길이 없다**
  // 사람이 말한 것이 있으면 그것, 없으면 **기하 제안**(흐리게). 제안은 저장되지
  // 않는다 — `f` 를 눌러야 판정이 된다. 애매하면 서버가 아예 제안을 안 낸다
  const face = d.dataset.facing || t.facing_hint || "";
  const guessed = !d.dataset.facing && !!t.facing_hint;
  const left = t.base[0][0] <= t.base[1][0] ? 0 : 1;
  const front = face === "left" ? left : face === "right" ? 1 - left : -1;
  svg.querySelectorAll("g.h").forEach(h => {
    const i = +h.dataset.i;
    h.style.display = isFin ? "" : "none";
    h.classList.toggle("front", i === front);
    h.classList.toggle("guess", i === front && guessed);
    h.setAttribute("transform", `translate(${t.base[i][0]},${t.base[i][1]})`);
  });
  d.querySelector(".lab").textContent =
    d.dataset.cls === "fin" ? "" : CLS_KO[d.dataset.cls];
  d.querySelector(".edg").textContent =
    d.dataset.edges === "both" ? "" : EDG_KO[d.dataset.edges];
}

function drag(d, t) {
  const svg = d.querySelector("svg");
  const at = ev => {
    const r = svg.getBoundingClientRect();
    return [(ev.clientX - r.left) / r.width * t.size,
            (ev.clientY - r.top) / r.height * t.size];
  };
  svg.querySelectorAll("g.h").forEach(h => {
    h.onpointerdown = ev => {
      ev.preventDefault(); h.setPointerCapture(ev.pointerId);
      const i = +h.dataset.i;
      const move = e => { t.base[i] = at(e); t.base_moved = true; touched = true;
                          d.dataset.touched = "1"; draw(d, t); };
      const up = e => { h.releasePointerCapture(ev.pointerId);
                        svg.removeEventListener("pointermove", move);
                        svg.removeEventListener("pointerup", up);
                        // 밑동을 옮긴 것은 그 자체로 '교정함' 이다
                        d.dataset.verdict = "fix";
                        if (!isBatch()) autosave(d, t); };
      svg.addEventListener("pointermove", move);
      svg.addEventListener("pointerup", up);
    };
  });
}

// **키와 우클릭 메뉴가 같은 함수를 부른다.** 둘로 갈라 두면 한쪽만 고쳐지고,
// 그것이 곧 화면과 자료가 어긋나는 길이다 (`rules.py` 를 하나로 둔 것과 같은 뜻).
function act(d, t, key) {
  // 숫자키는 CLASSES 순서 그대로다 — 분류가 늘면 키도 저절로 는다
  if (key.startsWith("edge:")) d.dataset.edges = key.slice(5);
  else if (CLS_BY_KEY[key]) d.dataset.cls = CLS_BY_KEY[key];
  else if (key === "x") {
    // **마스크가 없으면 이 축은 물을 수 없는 말이다.** 새 검출기가 들인 상자는
    // 아직 윤곽이 없고, 서버도 `verdict` 를 안 적는다(`views.save`). 화면만
    // 바뀌고 저장이 조용히 버리는 것이 이 저장소에서 가장 자주 겪은 버그다 —
    // 그러니 **눌리지 않게 하고 왜인지 말한다**
    if (!t.mask_id) {
      warn("마스크가 없는 상자다 — 윤곽 판정(`x`)은 아직 물을 수 없다. "
         + "**여기서 답할 것은 분류 하나**다 (지느러미면 그대로, 헛것이면 9). "
         + "manage.py infer 로 마스크를 얹으면 `엔진 바뀜` 에 뜬다.");
      return;
    }
    d.dataset.verdict = d.dataset.verdict === "fix" ? "ok" : "fix";
  }
  else if (key.startsWith("part:")) d.dataset.partial = key.slice(5);
  else if (key.startsWith("face:")) d.dataset.facing = key.slice(5);
  else if (key === "f") {
    // **여기서는 순환이 맞다.** `e` 를 순환에서 뺀 것은 값이 넷이라 목표까지
    // 중간값 둘을 지나야 했기 때문이다. 여기는 셋이고 기본이 "모름" 이라
    // 왼쪽은 한 번, 오른쪽은 두 번이고, 그 두 번은 붙여 누르므로 저장이
    // 묶인다. 되짚기에서 사이를 길게 두고 누르면 "왼쪽" 이 한 건 쌓이는 것이
    // 남는 값인데, 손이 훨씬 빨라지는 값이 그보다 크다.
    const order = FACINGS.map(([k]) => k);
    d.dataset.facing = order[(order.indexOf(d.dataset.facing) + 1) % order.length];
  }
  else if (key === "photo")
    // 이름을 준 창이라 우클릭을 거듭해도 창이 쌓이지 않고 같은 창이 바뀐다
    return open(`/photo/${d.dataset.box}`, "finphoto"), true;
  else if (key === "edit")
    return open(`/edit/${d.dataset.box}`, "finedit",
                "width=1100,height=900"), true;
  else return false;
  // **칸마다도 표시해 둔다.** '검토한 것' 을 넘겨볼 때는 손댄 칸만 저장해야
  // 한다 — 안 그러면 페이지를 넘길 때마다 똑같은 판정이 24건씩 다시 쌓인다
  d.dataset.touched = "1";
  touched = true; warn(""); draw(d, t);
  if (!isBatch()) autosave(d, t);
  return true;
}

// 메뉴는 키가 하는 일을 **보여 주는** 자리다. 오늘 `e`(날)와 `x`(교정필요)를
// 못 찾아 헤맨 것이 안내줄에 적혀 있었는데도 그랬다 — 우클릭이 더 눈에 띈다
const MENU = [["원본 사진 — 주변을 본다", "photo"],
              ["윤곽 고치기 — 크게 띄운다", "edit"], null,
              ...CLASSES.map(([k, ko]) => [ko, CLASS_KEYS[k]]), null,
              ["교정 필요", "x"], ["날 …", "edges"],
              ["아래경계 …", "partials"], ["앞쪽 …", "facings"]];

// `e` 로 띄우는 작은 차림표. 숫자로도 고를 수 있게 순서를 그대로 쓴다
const EDGE_MENU = EDGES.map(([k, ko], i) => [ko, "edge:" + k, String(i + 1)]);
// 밑동 두 점 중 어느 것을 짐작으로 찍었나. `edges` 와 같은 꼴로 고른다 —
// 토글로 두면 값이 넷인 축을 두 값처럼 다루게 된다
const PART_MENU = PARTIALS.map(([k, ko], i) => [ko, "part:" + k, String(i + 1)]);
// 밑동 두 점 중 앞(머리 쪽). re-ID 의 좌현·우현이 이 한 비트에 달렸다
const FACE_MENU = FACINGS.map(([k, ko], i) => [ko, "face:" + k, String(i + 1)]);

// 차림표가 지금 무엇을 띄우고 있나. 날 차림표일 때는 숫자키가 분류가 아니라
// 날을 고른다 — **떠 있는 것이 키를 갖는다**
let menuKind = null;

function hideMenu() {
  document.getElementById("menu").hidden = true;
  menuKind = null;
}

function showMenu(d, t, x, y, kind) {
  const m = document.getElementById("menu");
  menuKind = kind || "main";
  const items = menuKind === "edges" ? EDGE_MENU
              : menuKind === "partials" ? PART_MENU
              : menuKind === "facings" ? FACE_MENU : MENU;
  m.innerHTML = items.map(it => it === null ? `<hr>`
    : `<button data-key="${it[1]}">${it[0]}<kbd>${
         it[2] || (it[1] === "photo" ? "우클릭" : it[1] === "edges" ? "e"
                 : it[1] === "partials" ? "p"
                 : it[1] === "facings" ? "f" : it[1])}</kbd></button>`).join("");
  m.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      // '날 …' 은 고르는 것이 아니라 그다음 차림표를 여는 것이다
      if (["edges", "partials", "facings"].includes(b.dataset.key)) {
        const r = m.getBoundingClientRect();
        return showMenu(d, t, r.left, r.top, b.dataset.key);
      }
      act(d, t, b.dataset.key); hideMenu();
    };
  });
  m.hidden = false;
  // 창 밖으로 나가지 않게 접어 넣는다
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, innerWidth - r.width - 6) + "px";
  m.style.top = Math.min(y, innerHeight - r.height - 6) + "px";
}

// **고친 윤곽을 격자가 받아 든다.** 새로고침을 시키면 아직 저장 안 한 다른
// 칸들이 통째로 날아간다. 받아 두어야 이 칸을 나중에 저장할 때도 교정본이
// 함께 나간다 — 안 그러면 뒤에 쌓이는 판정이 교정본 없는 것이 되어 덮인다.
addEventListener("message", ev => {
  if (ev.origin !== location.origin || ev.data?.type !== "polygon") return;
  const t = tiles.find(x => x.box_id == ev.data.box_id);
  const d = document.querySelector(`.tile[data-box="${ev.data.box_id}"]`);
  if (!t || !d) return;
  if (ev.data.polygon_edited) { t.points = ev.data.points; t.poly_edited = true; }
  if (ev.data.facing_moved) d.dataset.facing = ev.data.facing || "";
  // 편집 창에서 밑동도 고칠 수 있다. 안 건드렸으면 안 온다
  if (ev.data.base_moved) { t.base = ev.data.base; t.base_moved = true; }
  d.dataset.verdict = "fix";
  d.dataset.touched = "1";
  draw(d, t);
  // 편집 창이 이미 저장했다 — 기준선을 여기로 옮겨 두 번 보내지 않는다
  t.sig = sigOf(d, t);
  warn("");
});

addEventListener("pointerdown", e => {
  if (!e.target.closest("#menu")) hideMenu();
}, true);
addEventListener("beforeunload", flush);
// 탭을 옮기거나 창을 감출 때도 흘려보낸다 — beforeunload 는 안 오는 경우가 있다
addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flush();
});
addEventListener("scroll", hideMenu, {passive: true});

addEventListener("keydown", e => {
  if (e.key === "Escape") return hideMenu();
  if (e.key === "Enter") {
    e.preventDefault();
    // 되짚어 볼 때는 저장이 자동이라 Enter 가 '다음 페이지' 다
    return isBatch() ? save(false) : load({page: page + 1});
  }
  // **되묻는 데 Enter 를 쓰지 않는다.** Enter 가 사고의 원인인데 그것으로 확인을
  // 받으면 두 번째 Enter 가 곧바로 확인이 되어 아무것도 막지 못한다
  if (e.key === "y" && !touched) { e.preventDefault(); return save(true); }
  if (e.key === "[") { e.preventDefault(); return load({page: page - 1}); }
  if (e.key === "]") { e.preventDefault(); return load({page: page + 1}); }
  // 처음 본 것과 가장 최근 본 것을 오가는 일이 잦다 — 기준이 흔들렸는지
  // 보려면 첫 페이지와 마지막 페이지를 비교해야 한다
  if (e.key === "Home") { e.preventDefault(); return load({page: 1}); }
  if (e.key === "End") { e.preventDefault(); return load({page: pages}); }
  if (!hover) return;
  const t = tiles.find(x => x.box_id == hover.dataset.box);
  if (!t) return;
  // **날 차림표가 떠 있으면 숫자는 날을 고른다.** 떠 있는 것이 키를 갖는다 —
  // 안 그러면 고르려고 누른 숫자가 분류를 바꿔 버린다
  if (menuKind === "edges" || menuKind === "partials"
      || menuKind === "facings") {
    const list = menuKind === "edges" ? EDGE_MENU
               : menuKind === "partials" ? PART_MENU : FACE_MENU;
    const i = "123456".indexOf(e.key);
    if (i >= 0 && i < list.length) {
      e.preventDefault();
      act(hover, t, list[i][1]); hideMenu();
    }
    return;
  }
  // `f` 는 차림표가 아니라 바로 돈다 (act 안의 주석). 우클릭 메뉴에는 그대로
  // 남아 있어서 값을 곧장 고르거나 무엇이 있는지 볼 수 있다
  if (e.key === "e" || e.key === "p") {
    e.preventDefault();
    const r = hover.getBoundingClientRect();
    return showMenu(hover, t, r.left + 8, r.top + 8,
                    e.key === "e" ? "edges" : "partials");
  }
  act(hover, t, e.key);
});

async function save(force) {
  if (!tiles.length) return;
  // **손 안 댄 묶음은 Enter 로 안 넘어간다.** 기본값이 맞는 묶음도 있을 수 있어
  // 막지는 않지만, 한 번 더 뜻을 물어야 지나간다 — 저장 단추나 y.
  if (!touched && !force && (mode === "todo" || mode === "new")) {
    warn(mode === "new"
      ? `이 ${tiles.length}장은 아무것도 안 건드렸다. **전부 진짜 등지느러미라고 `
        + `저장된다** — 여기서 재는 것이 바로 그 비율이라 눈으로 본 것만 넘길 것 `
        + `(헛것은 9). 정말이면 y 또는 저장 단추.`
      : `이 ${tiles.length}장은 아무것도 안 건드렸다. 기본값(등지느러미·양날·통과·`
        + `상자 모서리 밑동) 그대로 저장된다 — 정말이면 y 또는 저장 단추.`);
    return;
  }
  // **'검토한 것' 에서는 손댄 칸만 보낸다.** 이미 판정이 붙어 있는 칸이라
  // 안 건드린 것을 다시 보내면 같은 값이 한 벌 더 쌓일 뿐이다. 반대로 '검토할
  // 것' 에서는 안 누른 것도 판정이다 — 기본값으로 두고 예외만 누르는 화면이다.
  const items = tiles.map(t => {
    const d = document.querySelector(`.tile[data-box="${t.box_id}"]`);
    if (!isBatch() && d.dataset.touched !== "1") return null;
    return itemOf(d, t);
  }).filter(Boolean);
  if (!items.length) { warn("고친 칸이 없다 — 저장할 것이 없다."); return; }
  // **저장 실패는 반드시 화면에 뜬다.** 전에는 `.then(r => r.json())` 이 곧바로
  // 붙어 있어서, 403 이 HTML 을 내면 json() 이 던지고 그 예외를 아무도 안 받았다.
  // 화면은 그대로 있고 `load()` 도 안 불려서 **Enter 가 안 먹는 것처럼만** 보였다 —
  // 실제로는 한 묶음도 안 들어가고 있었다. 자료가 조용히 사라지는 쪽이 아니라
  // 조용히 안 들어가는 쪽이라 다행이었을 뿐이다.
  let res;
  try {
    res = await fetch("/api/review", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-CSRFToken": csrf()},
      body: JSON.stringify({items}),
    });
  } catch (err) {
    warn(`저장 실패 — 서버에 닿지 못했다 (${err}). 이 묶음은 **아직 안 들어갔다.** `
       + `화면을 그대로 두고 서버가 떠 있는지 볼 것.`);
    return;
  }
  if (!res.ok) {
    warn(`저장 실패 — 서버가 ${res.status} 를 냈다. 이 묶음은 **아직 안 들어갔다.**`
       + (res.status === 403
          ? " CSRF 쿠키가 없다 — 새로고침하면 다시 받는다"
            + " (이 묶음을 지키려면 새 탭에서 /admin/ 을 한 번 열고 돌아와 Enter)."
          : " 새로고침하면 이 묶음의 판정이 사라진다."));
    return;
  }
  const r = await res.json();
  if (r.error) { warn(`저장 실패 — ${r.error}`); return; }
  load();
}

async function stat() {
  const p = await fetch("/api/progress").then(r => r.json());
  const el = document.getElementById("stat");
  const n = k => (p[k] || 0).toLocaleString();
  // **남은 일을 먼저 적는다.** 엔진을 갈아 끼우면 "검토함" 은 그대로인데 그
  // 판정들이 옛 마스크에 대한 말이 된다 — 그것만 보면 다 끝난 것처럼 보인다
  const left = (p["엔진바뀜"] || 0) + (p.pending || 0) + (p["교정대기"] || 0);
  el.innerHTML = (left
      ? `<b style="color:var(--fix)">남은 일 ${left.toLocaleString()}</b>`
        + (p["엔진바뀜"] ? ` (엔진바뀜 ${n("엔진바뀜")}` : " (")
        + (p.pending ? ` 안 봄 ${n("pending")}` : "")
        + (p["교정대기"] ? ` 교정대기 ${n("교정대기")}` : "") + ") · "
      : `<b style="color:var(--fin)">남은 일 없다</b> · `)
    + `검토 <b>${n("검토함")}</b>/${n("상자")}`
    + ` · 양성 <b>${n("positive")}</b> 배경 <b>${n("background")}</b>`
    + (p.drop ? ` 뺌 <b>${n("drop")}</b>` : "")
    + (p["마스크없음"] ? ` · 마스크없음 ${n("마스크없음")}` : "")
    // **새 검출은 따로 적는다.** 옛 상자의 검토가 다 끝나도 이쪽은 남아 있고,
    // 한 숫자에 섞으면 그 사실이 안 보인다 (엔진 바뀜에서 겪은 것과 같다)
    + (p["새검출"]
        ? ` · 새 검출 <b>${n("새검출")}</b>`
          + (p["새검출대기"] ? ` (대기 <b style="color:var(--fix)">`
              + `${n("새검출대기")}</b>` : " (")
          + (p["새검출:진짜"] ? ` 진짜 ${n("새검출:진짜")}` : "")
          + (p["새검출:헛것"] ? ` 헛것 ${n("새검출:헛것")}` : "") + ")"
        : "");
}

load();
</script>
