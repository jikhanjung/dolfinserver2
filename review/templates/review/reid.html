{% load static %}<!doctype html>
<meta charset="utf-8">
<title>개체 분류</title>
<style>
  :root { --bg:#0b0f14; --panel:#141b23; --line:#26303c; --ink:#e6edf3;
          --dim:#8b98a5; --ok:#4ade80; --no:#f87171; --sel:#60a5fa;
          /* 찾아 준 칸에만 쓰는 순색 빨강. `--no`(#f87171)는 경고용이라
             톤을 낮춰 둔 색이고, 흐린 칸들 사이에서는 그만큼 덜 걸린다 */
          --find:#ff1f2e;
          /* **결각은 작은 흠이라 하필 사람이 알아보는 문턱 근처에 있다**
             (`TODOs`). 작게 늘어놓으면 빨리 넘길 수는 있어도 판정이 흐려진다.
             화면 크기에 따라 다르니 손으로 고르게 둔다 */
          --fin:220px;
          /* 상자 안의 것도 **견줄 수 있을 만큼**은 커야 한다. 44px 로는
             "몇 장 들었나" 밖에 안 보이는데, 정작 자주 하는 일은 새로 넣으려는
             것과 이미 든 것을 견주는 것이다 */
          --thumb:88px; --sidew:400px; }
  * { box-sizing:border-box }
  html, body { height:100% }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.6
         "IBM Plex Sans KR", system-ui, sans-serif; display:flex;
         flex-direction:column; overflow:hidden }
  header { border-bottom:1px solid var(--line); padding:8px 13px;
           display:flex; gap:11px; align-items:center; flex-wrap:wrap }
  h1 { font-size:15px; margin:0; font-weight:600 }
  .stat { color:var(--dim); font-size:12.5px }
  .stat b { color:var(--ink) }
  kbd { background:#1d2733; border:1px solid var(--line); border-radius:3px;
        padding:0 5px; font:11px "IBM Plex Mono",monospace; color:var(--ink) }
  button, select { font:inherit; font-size:13px; background:var(--panel);
    color:var(--ink); border:1px solid var(--line); border-radius:5px;
    padding:4px 11px; cursor:pointer }
  button:hover, select:hover { border-color:var(--dim) }
  button.pri { background:#16302b; border-color:var(--ok); color:var(--ok) }

  #main { flex:1; display:flex; min-height:0 }
  #grid { flex:1; overflow-y:auto; padding:10px; display:flex;
          flex-wrap:wrap; gap:6px; align-content:flex-start }
  #side { width:var(--sidew); flex:none; border-left:1px solid var(--line);
          display:flex; flex-direction:column; min-height:0 }
  #side .top { padding:8px 10px; border-bottom:1px solid var(--line);
               display:flex; gap:7px; align-items:center }
  #boxes { flex:1; overflow-y:auto; padding:8px }

  .fin { position:relative; width:var(--fin); height:var(--fin); cursor:grab;
         border:2px solid transparent; border-radius:6px; background:#000 }
  .fin img { width:100%; height:100%; object-fit:cover; border-radius:4px;
             display:block; pointer-events:none }
  .fin.sel { border-color:var(--sel) }
  /* **이미 상자에 든 것은 흐리게.** 남은 일이 무엇인지 한눈에 보여야 한다 */
  .fin.done { opacity:.4 }
  .fin.done img { opacity:.55 }
  /* **어느 상자에 넣었는지 한가운데 크게.** 아래 구석의 작은 글씨는 흐린 칸
     위에서 안 읽힌다 — 정작 자주 하는 일이 "얘는 어디 넣었더라" 다.
     칸 크기가 슬라이더로 바뀌므로 글자도 따라 커진다 */
  .fin.done::after { content:attr(data-box-name); position:absolute;
    left:0; right:0; top:50%; transform:translateY(-50%);
    color:#fff; font-weight:700; text-align:center;
    font-size:calc(var(--fin) / 5.5); line-height:1.15; padding:0 4px;
    letter-spacing:-.01em;
    text-shadow:0 2px 7px #000, 0 0 4px #000, 0 0 12px #000;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis }
  /* **찾아 준 것이 눈에 띄어야 한다.** 상자에서 눌러 격자로 보냈는데 그것이
     어느 칸인지 스스로 찾아야 한다면 보내 준 뜻이 없다 — 흐려진 칸들
     사이에서 파란 테 하나는 잘 안 걸린다 */
  @keyframes findme {
    0%, 100% { border-color:var(--find); box-shadow:0 0 0 0 #ff1f2e00 }
    50%      { border-color:var(--find); box-shadow:0 0 0 9px #ff1f2eaa }
  }
  .fin.found { animation:findme .45s ease-in-out 4; opacity:1 !important;
               border-color:var(--find); border-width:3px; z-index:2 }
  .fin.found img { opacity:1 }
  @media (prefers-reduced-motion:reduce) {
    .fin.found { animation:none; box-shadow:0 0 0 6px #ff1f2ecc }
  }
  .fin .r { position:absolute; right:4px; top:4px; background:#000b;
    color:#cfd8e3; font:11px "IBM Plex Mono",monospace; padding:1px 5px;
    border-radius:3px }
  .fin.done::after { font-size:11px }
  input[type=range] { width:110px; vertical-align:middle }

  .box { border:1px solid var(--line); border-radius:6px; margin-bottom:7px;
         background:var(--panel) }
  .box.over { border-color:var(--ok); background:#16302b }
  .box .hd { display:flex; gap:6px; align-items:center; padding:6px 8px }
  .box .nm { flex:1; font-weight:600; font-size:13px; outline:none }
  .box .nm:focus { color:var(--ok) }
  .box .cnt { color:var(--dim); font-size:12px;
              font-family:"IBM Plex Mono",monospace }
  .box .thumbs { display:flex; flex-wrap:wrap; gap:3px; padding:0 8px 8px }
  .box .thumbs img { width:var(--thumb); height:var(--thumb);
                     object-fit:cover; border-radius:4px; cursor:pointer;
                     border:2px solid transparent }
  .box .thumbs img:hover { border-color:var(--sel) }
  .drop { padding:10px; border:2px dashed var(--line); border-radius:6px;
          color:var(--dim); text-align:center; font-size:12.5px;
          margin-bottom:7px }
  .drop.over { border-color:var(--no); color:var(--no) }
  /* **맨 아래 빈 상자.** 단추를 눌러 만들고 다시 끄는 것은 걸음이 둘이다 —
     끌어 넣는 그 동작 하나로 상자가 생기게 한다. 넣고 나면 아래에 또 하나
     빈 것이 생기므로 "다음 개체" 가 늘 준비되어 있다 */
  .box.new { border-style:dashed; background:none }
  .box.new .hd { color:var(--dim); font-size:12.5px; justify-content:center;
                 padding:14px 8px }
  .box.new.over { border-style:solid; border-color:var(--ok);
                  background:#16302b; color:var(--ok) }
  .warn { margin:14px; padding:10px 13px; background:#2a1416;
          border:1px solid #5c2a2f; border-left:3px solid var(--no);
          border-radius:6px; color:#ffc9cd; font-size:13px; max-width:74ch }
</style>

<header>
  <h1>개체 분류</h1>
  <span class="stat">아직 안 넣은 것 <b id="nleft">0</b> / {{ n_items }}</span>
  <select id="sort">
    <option value="sim">닮은 것끼리</option>
    <option value="rough">특징적인 것부터</option>
    <option value="day">날짜순</option>
  </select>
  <select id="fside">
    <option value="">좌·우 모두</option>
    <option value="left">왼쪽이 앞</option>
    <option value="right">오른쪽이 앞</option>
  </select>
  <label class="stat"><input type="checkbox" id="hidedone" checked>
    넣은 것 숨기기</label>
  <span class="stat">크기 <input type="range" id="size" min="96" max="380"
    step="4" value="220"></span>
  <span class="stat">상자 <input type="range" id="tsize" min="44" max="160"
    step="4" value="88"></span>
  <span style="flex:1"></span>
  <span class="stat"><kbd>클릭</kbd>고르기 <kbd>Shift</kbd>범위
    <kbd>Ctrl</kbd>더하기 <kbd>우클릭</kbd>원본 <kbd>끌기</kbd>상자로</span>
</header>

{% if not ready %}
<div class="warn">
  <b>분류할 것이 없다.</b> <code>reid/v1/items.json</code> 과
  <code>reid/v1/look/</code> 이 있어야 한다.
</div>
{% else %}
<div id="main">
  <div id="grid"></div>
  <div id="side">
    <div class="top">
      <span class="stat" id="selinfo">고른 것 0</span>
    </div>
    <div id="boxes"></div>
  </div>
</div>

<script>
const ITEMS = {{ items|safe }};
let BOXES = {{ boxes|safe }};
const csrf = () => (document.cookie.match(/csrftoken=([^;]+)/) || [])[1] || "";
const byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));
let sel = new Set(), lastClick = null;

// **모델은 순서만 돕는다.** 묶음을 만들어 보였더니 쓸모가 없었다 — 묶음이
// 밝기로 뭉친 정도가 68%였고, 특이한 개체는 남과 안 닮아 혼자 남아서 오히려
// 안 보였다. 판단은 사람이 하고, 이쪽은 **이웃이 닮게 늘어놓아 눈이 덜
// 움직이게만** 한다.
function view() {
  const s = document.getElementById("sort").value;
  const side = document.getElementById("fside").value;
  const hide = document.getElementById("hidedone").checked;
  const v = ITEMS.filter(i => (!side || i.facing === side) && !(hide && i.in));
  v.sort(s === "rough" ? (a, b) => b.rough - a.rough
       : s === "day" ? (a, b) => (a.day + a.id).localeCompare(b.day + b.id)
       : (a, b) => a.sim - b.sim);
  return v;
}

function draw() {
  const nm = Object.fromEntries(BOXES.map(b => [b.id, b.name]));
  document.getElementById("grid").innerHTML = view().map(i =>
    `<div class="fin${sel.has(i.id) ? " sel" : ""}${i.in ? " done" : ""}"
          draggable="true" data-id="${i.id}"
          data-box-name="${i.in ? (nm[i.in] || "") : ""}"
          title="box ${i.id} · ${i.day} · 결각 ${i.rough}">
       <img src="/reid/chip/${i.id}.png" loading="lazy" alt="">
       <span class="r">${i.rough}</span>
     </div>`).join("");
  document.getElementById("nleft").textContent = ITEMS.filter(i => !i.in).length;
  document.getElementById("selinfo").textContent = `고른 것 ${sel.size}`;
  drawBoxes();
}

function drawBoxes() {
  const mine = {};
  ITEMS.forEach(i => { if (i.in) (mine[i.in] = mine[i.in] || []).push(i.id); });
  document.getElementById("boxes").innerHTML =
    `<div class="drop" id="unbox">여기로 끌면 <b>상자에서 뺀다</b></div>`
    + BOXES.map(b => `
      <div class="box" data-box="${b.id}">
        <div class="hd">
          <span class="nm" contenteditable="plaintext-only"
                data-id="${b.id}">${b.name}</span>
          <span class="cnt">${(mine[b.id] || []).length}</span>
        </div>
        <div class="thumbs">${(mine[b.id] || []).map(id =>
          `<img src="/reid/chip/${id}.png" data-id="${id}" loading="lazy"
                title="눌러서 격자에서 찾기">`).join("")}</div>
      </div>`).join("")
    + `<div class="box new" data-box="new">
         <div class="hd">여기로 끌면 <b>새 상자</b></div>
       </div>`;
  bindBoxes();
}

// ---- 고르기 ---------------------------------------------------------------
document.getElementById("grid").onclick = e => {
  const f = e.target.closest(".fin");
  if (!f) { sel.clear(); draw(); return; }
  const id = +f.dataset.id;
  if (e.shiftKey && lastClick !== null) {
    // **범위로 고른다.** 닮은 순서로 이웃해 있는 것을 하나씩 누르게 하면
    // 손이 너무 많이 간다 — 이 화면의 목적이 한 번에 넣는 것이다
    const v = view().map(i => i.id);
    const a = v.indexOf(lastClick), b = v.indexOf(id);
    if (a >= 0 && b >= 0)
      v.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(x => sel.add(x));
  } else if (e.ctrlKey || e.metaKey) {
    sel.has(id) ? sel.delete(id) : sel.add(id);
  } else if (sel.has(id) && sel.size === 1) {
    sel.delete(id);
  } else {
    sel.clear(); sel.add(id);
  }
  lastClick = id;
  draw();
};
document.getElementById("grid").oncontextmenu = e => {
  const f = e.target.closest(".fin");
  if (!f) return;
  e.preventDefault();
  open(`/photo/${f.dataset.id}`, "finphoto");
};

// ---- 끌기 -----------------------------------------------------------------
// 고른 것이 여럿이면 **함께 간다**
document.getElementById("grid").ondragstart = e => {
  const f = e.target.closest(".fin");
  if (!f) return;
  const id = +f.dataset.id;
  if (!sel.has(id)) { sel.clear(); sel.add(id); draw(); }
  e.dataTransfer.setData("text/plain", JSON.stringify([...sel]));
  e.dataTransfer.effectAllowed = "move";
};

function bindBoxes() {
  document.querySelectorAll(".box, #unbox").forEach(el => {
    el.ondragover = ev => { ev.preventDefault(); el.classList.add("over"); };
    el.ondragleave = () => el.classList.remove("over");
    el.ondrop = async ev => {
      ev.preventDefault(); el.classList.remove("over");
      let ids = [];
      try { ids = JSON.parse(ev.dataTransfer.getData("text/plain")); } catch (x) {}
      if (!ids.length) return;
      if (el.dataset.box === "new") {
        const r = await post("/api/reid/box", {});
        if (!r) return;
        BOXES.push({id: r.id, name: r.name, n: 0});
        await assign(r.id, ids);
        document.getElementById("boxes").scrollTop = 1e9;
        return;
      }
      await assign(el.id === "unbox" ? null : +el.dataset.box, ids);
    };
  });
  document.querySelectorAll(".box .nm").forEach(el => {
    el.onkeydown = ev => {
      if (ev.key === "Enter") { ev.preventDefault(); el.blur(); }
    };
    el.onblur = () => rename(+el.dataset.id, el.textContent.trim());
  });
  // 상자 안의 작은 그림을 누르면 격자에서 그것을 찾아 준다 — 다시 꺼낼 때
  document.querySelectorAll(".box .thumbs img").forEach(im => {
    im.onclick = () => {
      const id = +im.dataset.id;
      sel = new Set([id]);
      // 넣은 것을 숨겨 두었으면 찾아 줄 수가 없다 — 먼저 켜 준다
      document.getElementById("hidedone").checked = false;
      draw();
      flash(id);
    };
  });
}

// 격자에서 그 칸을 찾아 가운데로 옮기고 **빨갛게 몇 번 깜박인다**
function flash(id) {
  const t = document.querySelector(`.fin[data-id="${id}"]`);
  if (!t) return;
  t.scrollIntoView({block: "center", behavior: "smooth"});
  t.classList.remove("found");
  void t.offsetWidth;          // 애니메이션을 다시 시작시킨다
  t.classList.add("found");
  setTimeout(() => t.classList.remove("found"), 2200);
}

async function post(url, body) {
  const r = await fetch(url, {method: "POST",
    headers: {"Content-Type": "application/json", "X-CSRFToken": csrf()},
    body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({error: `서버가 ${r.status} 를 냈다`}));
  if (j.error) { alert(j.error); return null; }
  return j;
}

async function assign(indId, ids) {
  const r = await post("/api/reid/assign", {individual: indId, boxes: ids});
  if (!r) return;
  ids.forEach(id => { if (byId[id]) byId[id].in = indId; });
  sel.clear();
  draw();
}

async function rename(id, name) {
  const b = BOXES.find(x => x.id === id);
  if (!b) return;
  if (!name || b.name === name) return draw();
  const r = await post("/api/reid/box", {id, name});
  if (!r) return draw();
  b.name = r.name;
  draw();
}

["sort", "fside", "hidedone"].forEach(id =>
  document.getElementById(id).onchange = () => { sel.clear(); draw(); });
addEventListener("keydown", e => {
  if (e.key === "Escape") { sel.clear(); draw(); }
  if ((e.ctrlKey || e.metaKey) && e.key === "a") {
    e.preventDefault(); view().forEach(i => sel.add(i.id)); draw();
  }
});
draw();
</script>
{% endif %}
