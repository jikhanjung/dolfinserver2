<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>잠시 멈춰 있다</title>
  <!-- **JS 가 막혀도 돌아온다.** 아래 폴링이 주된 길이지만, 그것이 안 도는
       자리에서도 30초마다 스스로 다시 온다. -->
  <meta http-equiv="refresh" content="30">
  <style>
    body { font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
           background: #14181d; color: #d8dee4; display: flex; min-height: 100vh;
           align-items: center; justify-content: center; margin: 0; }
    main { max-width: 32rem; padding: 2rem; line-height: 1.7; }
    h1 { font-size: 1.25rem; margin: 0 0 .75rem; }
    p { margin: 0 0 .6rem; color: #9aa5b1; }
    .sub { font-size: .875rem; color: #6b7681; margin: 1.25rem 0 0; }
    .dot { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%;
           background: #4ade80; margin-right: .45rem; vertical-align: baseline;
           animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
  </style>
</head>
<body>
  <main>
    <h1>잠시 멈춰 있다</h1>
    <!-- **두 경우를 한 화면으로 받는다** — 배포 중(503)이거나 컨테이너가
         내려가 있거나(502). 보는 사람에게는 같은 일이고, 어느 쪽인지 단정하면
         한쪽에서 거짓말이 된다. -->
    <p>새 판으로 갈아 끼우는 중이거나, 화면이 잠시 멎었다.
       보통 몇십 초면 돌아온다.</p>
    <p class="sub"><span class="dot"></span><span id="s">돌아오면 저절로 열린다</span></p>
  </main>
  <script>
    // **살아났나를 `/healthz` 로 묻는다.** 그것은 문(접속 코드) 밖에 있고
    // (`review/gate.py` 의 `OPEN`) 역할과 판을 내므로, 200 이면 진짜로 받을
    // 준비가 된 것이다. 페이지를 통째로 다시 받아 보는 것보다 싸다.
    let n = 0;
    const say = t => document.getElementById('s').textContent = t;
    setInterval(async () => {
      n++;
      try {
        const r = await fetch('/healthz', {cache: 'no-store'});
        if (r.ok) { say('돌아왔다 — 여는 중'); location.reload(); return; }
      } catch (e) { /* 아직 안 떴다 — 조용히 넘어간다 */ }
      // 오래 걸리면 말을 바꾼다. 같은 문구가 3분째 깜빡이면 **멎은 것처럼
      // 보인다** — 기다리라고 할 거면 얼마나 기다렸는지는 보여야 한다.
      if (n > 40) say('아직이다 — ' + Math.round(n * 3 / 60) + '분째 기다리는 중');
    }, 3000);
  </script>
</body>
</html>
