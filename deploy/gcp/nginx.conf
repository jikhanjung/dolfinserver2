# GCP(`dolfinid-2`) 호스트 nginx — 자리: /etc/nginx/sites-available/dolfinserver2.conf
# 반영: sudo nginx -t && sudo systemctl reload nginx
#
# **밖으로 연다** — `https://reid.nopeoplestime.info`. 443 블록과 80→443
# 되보내기는 **certbot 이 붙인다** (형제 `cdgts` 와 같은 방식):
#
#     sudo certbot --nginx -d reid.nopeoplestime.info
#
# 여는 조건이 둘 있었다. **https** — 이 앱에는 사람마다의 인증이 없고
# 접속 코드 하나가 문이라, 평문으로 나르면 코드도 세션 쿠키도 그대로 샌다.
# 그리고 **`.env` 의 `FIN_HTTPS=1`** — 안 켜면 Django 가 스스로를 http 로
# 알아서 CSRF 가 스킴 어긋남으로 막는다.
#
# tailnet 8085 는 닫았다 (2026-08-27). 들어가는 길을 하나로 줄인 것이다 —
# 대신 **certbot 이 멎으면 들어갈 뒷문이 없다.** `docker compose` 와 ssh 는
# 그대로 있으니 급하면 이 파일에 tailnet 리스너를 다시 얹는다.

upstream dolfinserver2 {
    server 127.0.0.1:8012;
}

server {
    listen      80;
    server_name reid.nopeoplestime.info;
    charset     utf-8;

    client_max_body_size 75M;

    if (-f /srv/dolfinserver2/maintenance.flag) {
        return 503;
    }
    error_page 503 /maintenance.html;
    # **컨테이너가 그냥 내려가 있을 때도 같은 안내를 준다.** 깃발은 배포
    # 스크립트가 걸어 주는 것이라(`deploy/gcp/deploy.sh` 의 `touch`+`trap`),
    # 손으로 `docker compose up -d` 만 하면 그 창에서 nginx 가 upstream 접속
    # 실패로 **생짜 502** 를 낸다. `.guides/web/operations.md` 가 세 상태를
    # `200 정상 · 503 유지보수 · 502 컨테이너 내려감` 으로 갈라 두었는데,
    # **보는 사람에게는 뒤의 둘이 같은 일**이다.
    #
    # **`proxy_intercept_errors` 는 켜지 않는다.** 그것은 upstream 이 **낸**
    # 오류까지 가로채므로, 앱이 스스로 내는 5xx(`/healthz` 의 `unhealthy` 503)
    # 까지 안내 화면으로 덮어 버린다 — 그러면 배포가 성한지 묻는 자가 죽는다.
    # 여기서 받는 것은 **nginx 가 만든** 502/504 뿐이다.
    error_page 502 504 /maintenance.html;
    location = /maintenance.html {
        root /srv/dolfinserver2;
        internal;
    }

    # 점파일 차단.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location /static {
        alias /srv/dolfinserver2/staticfiles;
    }

    # 크롭. `reid` 역할이라 격자는 조각으로 도는데, 조각 옆에 크롭을 볼 때가 있다.
    location /crops {
        alias /srv/dolfinserver2/crops;
        expires 7d;
        add_header Cache-Control "private, max-age=604800";
    }

    # `/photos` 는 없다 — 사진이 이 기계에 없다. 화면이 스스로 그렇게 말한다.

    location / {
        proxy_pass http://dolfinserver2;
        # **`$host` 가 아니라 `$http_host` 다** — `$host` 는 포트를 버리는데
        # 브라우저의 `Origin` 에는 붙어 있어, 기본 포트가 아닌 자리에서 CSRF 가
        # 어긋난다. 443 에서는 안 붙지만 규칙을 한 벌로 둔다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # **이것이 `FIN_HTTPS=1` 과 한 쌍이다.** 이 헤더가 없으면 Django 가
        # 스스로를 http 로 알고 CSRF 가 막는다.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # **화면은 캐시하지 않는다.** 격자가 조각 목록을 페이지에 그대로 실어
        # 보내는데(`ITEMS`), 브라우저가 옛 페이지를 들고 있으면 **자료를 고쳐도
        # 안 고쳐진 것으로 보인다** — 2026-08-27 에 그것으로 한 번 헤맸다.
        # 크롭·조각·정적파일은 위에서 따로 캐시한다.
        add_header Cache-Control "no-store" always;
    }
}
