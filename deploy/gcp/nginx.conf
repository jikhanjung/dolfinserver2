# GCP(`dolfinid-2`) 호스트 nginx — 자리: /etc/nginx/sites-available/dolfinserver2.conf
# 반영: sudo nginx -t && sudo systemctl reload nginx
#
# **tailnet 에만 연다.** 이 기계는 80/443 으로 cdGTS·ghdb 를 공개하고 있지만
# 여기는 그 줄에 안 선다 — **이 앱에는 인증이 없다.** `login_required` 도
# `LoginRequiredMiddleware` 도 없어서 `/api/reid/assign` 같은 쓰기 경로가
# 열려 있고, 그것이 쓰는 것은 **다시 만들 수 없는 사람의 판정**이다.
# 공개하려면 인증이 먼저다 (`TODOs.md`).
#
# tailscale IP 에 직접 바인드하므로 0.0.0.0 로는 안 뜬다. 포트 번호는 m710q
# 운영과 같은 8085 로 맞춰 두었다 — 두 자리를 오갈 때 헷갈리지 않게.

upstream dolfinserver2 {
    server 127.0.0.1:8012;
}

server {
    listen      100.126.94.48:8085;
    server_name _;
    charset     utf-8;

    client_max_body_size 75M;

    if (-f /srv/dolfinserver2/maintenance.flag) {
        return 503;
    }
    error_page 503 /maintenance.html;
    location = /maintenance.html {
        root /srv/dolfinserver2;
        internal;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location /static {
        alias /srv/dolfinserver2/staticfiles;
    }

    # 크롭. `reid` 역할에서는 `/` 격자를 안 쓰지만, `/photo` 대신 조각 옆에
    # 크롭을 보고 싶을 때가 있어 남겨 둔다.
    location /crops {
        alias /srv/dolfinserver2/crops;
        expires 7d;
        add_header Cache-Control "private, max-age=604800";
    }

    # `/photos` 는 없다 — 사진이 이 기계에 없다. 화면이 스스로 그렇게 말한다.

    location / {
        proxy_pass http://dolfinserver2;
        # **`$host` 가 아니라 `$http_host` 다 — 포트를 떼면 CSRF 가 깨진다.**
        # `$host` 는 포트를 버리는데, 브라우저가 보내는 `Origin` 에는 `:8085` 가
        # 붙어 있다. Django 의 CSRF origin 검사는 그 둘을 맞춰 보므로 포트가
        # 한쪽에만 있으면 **코드를 맞게 넣어도 403** 이 난다. 형제 설정들이
        # `$host` 를 쓰는 것은 그쪽이 80/443 이라 포트가 애초에 안 붙어서다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
