# **운영 compose.** 자리는 `/srv/dolfinserver2/docker-compose.yml` 이고
# 저장소본이 이 파일이다. 배포는 `.env` 의 `IMAGE_TAG` 만 바꾼다 —
# `.env` 를 통째로 다시 만들지 말 것 (`SECRET_KEY` 가 거기 있다).
#
# **이 자리가 m710q 의 정식 검토 화면이다.** `runserver` 는 시험이고,
# 시험 인스턴스는 `docker-compose.test.yml` 이 따로 든다.
services:
  web:
    container_name: dolfinserver2
    image: honestjung/dolfinserver2:${IMAGE_TAG:-0.2.0}
    ports:
      # nginx 가 유일한 공개 리스너다. 컨테이너는 로컬에만 바인드한다
      # (`.guides/web/operations.md` §1). 8104 는 이 기계에서 빈 자리다 —
      # 8100 paleonews · 8101 dolfinserver · 8102 naverland · 8103 ghdb.
      - "127.0.0.1:8104:8000"
    volumes:
      # **DB 는 파일이 아니라 디렉토리를 마운트한다.** WAL 의 `-wal`·`-shm`
      # 형제가 컨테이너 임시 레이어에 갇히면 호스트 백업이 커밋 꼬리를 놓친다.
      # **여기 것이 진짜 `fin.db` 다** — 파이프라인 명령도 같은 파일을 연다
      # (`settings` 의 `FIN_DB` 기본값). 사본이 아니라서 사본을 맞출 일이 없다.
      - ./db:/app/hostdb
      # **크롭·조각은 저장소 것을 읽기전용으로 건다.** 파생물이고 파이프라인이
      # 계속 다시 쓰는 것이라, 사본을 두면 갈아 끼울 때마다 낡는다.
      # `.gitignore` 가 셋 다 무시해서 `git` 이 이 디렉토리를 안 건드린다.
      - ${REPO:-/home/jikhanjung/projects/dolfinserver2}/crops:/app/crops:ro
      - ${REPO:-/home/jikhanjung/projects/dolfinserver2}/reid:/app/reid:ro
      - ./staticfiles:/app/staticfiles
      # 원본 사진. `/photo` 화면에서만 쓰고, 없으면 화면이 없다고 말한다.
      # **GCP(dolfinid2)에는 이 마운트가 없다** — 거기서는 이 줄을 지운다.
      - /nas/JikhanJung/dolfinimage:/app/photos/nas:ro
    env_file:
      - ./.env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
