# 호스트 nginx 설정 — 자리: /etc/nginx/sites-available/dolfinserver2.conf
# 반영: sudo nginx -t && sudo systemctl reload nginx
#
# `.guides/web/operations.md` §1: nginx 가 유일한 공개 리스너이고 컨테이너는
# 127.0.0.1 에만 바인드한다. **정적파일·크롭·사진은 nginx 가 직접 낸다** —
# 개발 서버(`finweb/urls.py` 의 `if settings.DEBUG`)가 내던 것이라, DEBUG=0
# 으로 띄우면 이쪽이 받지 않는 한 이미지가 통째로 깨진다.
#
# **역할을 막는 정본은 여기가 아니라 앱이다** (`FIN_ROLE`). nginx 로만 막으면
# 정작 새는 자리가 안 막힌다 — `runserver` 앞에는 nginx 가 없고, `/reid` 는
# **열기만 해도** 보류함 `Individual` 을 하나 만든다. 여기 있는 것은 이중이다.
#
# 조각(`/reid/chip/...`)은 여기 없다. 그것은 Django 가 낸다 — 같은 번호로
# `look/`(사람이 보는 큰 그림)과 `chips/`(모델이 먹는 것) 중 있는 것을 고르는
# 판단이 view 에 있어서다 (`review.views.reid_chip`).

upstream dolfinserver2 {
    # 컨테이너 바인드와 같아야 한다 (docker-compose: 127.0.0.1:8104:8000).
    server 127.0.0.1:8104;
}

server {
    listen      8085;
    server_name _;
    charset     utf-8;

    client_max_body_size 75M;

    # 배포 중 컨테이너 스왑 구간에 생짜 502 대신 안내를 준다.
    if (-f /srv/dolfinserver2/maintenance.flag) {
        return 503;
    }
    # `error_page 503 = /maintenance.html` 로 쓰면 `=` 가 상태코드를 200 으로
    # 덮어써서 유지보수인지 알 수 없게 된다. `=` 없이 쓴다.
    error_page 503 /maintenance.html;
    location = /maintenance.html {
        root /srv/dolfinserver2;
        internal;
    }

    # 점파일 차단 — 무결성 센티넬 같은 것이 경로로 새 나가지 않게.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location /static {
        alias /srv/dolfinserver2/staticfiles;
    }

    # 크롭 10,537장. 검토 격자가 이것으로 찬다. **저장소 것을 그대로 낸다** —
    # 파이프라인이 계속 다시 쓰는 파생물이라 사본을 두면 갈아 끼울 때마다 낡는다
    # (컨테이너도 같은 자리를 `:ro` 로 본다).
    location /crops {
        alias /home/jikhanjung/projects/dolfinserver2/crops;
        expires 7d;
        add_header Cache-Control "private, max-age=604800";
    }

    # 원본 사진. `photos/nas` 는 NAS 로 가는 심볼릭 링크다 — DB 가 경로를
    # `nas/2016/03/15/…` 로 들고 있어서 그 이름이 그대로 있어야 한다.
    location /photos {
        alias /srv/dolfinserver2/photos;
    }

    location / {
        proxy_pass http://dolfinserver2;
        # **`$host` 가 아니라 `$http_host` 다 — 포트를 떼면 CSRF 가 깨진다.**
        # `$host` 는 포트를 버리는데, 브라우저가 보내는 `Origin` 에는 `:8085` 가
        # 붙어 있다. Django 의 CSRF origin 검사는 그 둘을 맞춰 보므로 포트가
        # 한쪽에만 있으면 **코드를 맞게 넣어도 403** 이 난다. 형제 설정들이
        # `$host` 를 쓰는 것은 그쪽이 80/443 이라 포트가 애초에 안 붙어서다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # **화면은 캐시하지 않는다.** 격자가 조각 목록을 페이지에 그대로 실어
        # 보내는데(`ITEMS`), 브라우저가 옛 페이지를 들고 있으면 **자료를 고쳐도
        # 안 고쳐진 것으로 보인다** — 2026-08-27 에 그것으로 한 번 헤맸다.
        # 크롭·조각·정적파일은 위에서 따로 캐시한다.
        add_header Cache-Control "no-store" always;
    }
}
