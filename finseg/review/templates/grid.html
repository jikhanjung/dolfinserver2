<!doctype html>
<meta charset="utf-8">
<title>finseg 검토</title>
<style>
  :root {
    --bg:#12161c; --fg:#e8edf3; --dim:#8b97a6; --line:#242c36;
    --ok:#3fb27f; --notfin:#e05561; --fix:#e0a63f;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui,'Noto Sans KR',sans-serif; }
  header { position:sticky; top:0; z-index:10; background:var(--bg);
           border-bottom:1px solid var(--line); padding:10px 16px;
           display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.02em; }
  .stat { color:var(--dim); font-size:13px; }
  .stat b { color:var(--fg); font-weight:600; }
  button { background:#1d242e; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:6px 14px; font:inherit; cursor:pointer; }
  button:hover { border-color:#3a4553; }
  button.primary { background:var(--ok); border-color:var(--ok); color:#06120c;
                   font-weight:600; }
  #grid { display:grid; gap:10px; padding:16px;
          grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); }
  .tile { position:relative; border-radius:8px; overflow:hidden; cursor:pointer;
          border:3px solid var(--ok); background:#000; aspect-ratio:1; }
  .tile[data-v="not_fin"] { border-color:var(--notfin); }
  .tile[data-v="not_fin"] img, .tile[data-v="not_fin"] svg { opacity:.32; }
  .tile[data-v="fix"] { border-color:var(--fix); }
  .tile img { width:100%; height:100%; display:block; }
  .tile svg { position:absolute; inset:0; width:100%; height:100%; }
  .tile polygon { fill:rgba(63,178,127,.18); stroke:#4dffb0; stroke-width:2.5;
                  vector-effect:non-scaling-stroke; }
  .tile[data-v="not_fin"] polygon { stroke:#ff8f97; fill:none; }
  .tile[data-v="fix"] polygon { stroke:#ffc95c; fill:rgba(224,166,63,.15); }
  .badge { position:absolute; left:6px; top:6px; padding:1px 7px; border-radius:5px;
           font-size:11px; font-weight:700; background:#000a; }
  .tile[data-v="ok"] .badge { display:none; }
  .tile[data-v="not_fin"] .badge { color:#ff8f97; }
  .tile[data-v="fix"] .badge { color:#ffc95c; }
  .conf { position:absolute; right:6px; bottom:6px; font-size:11px;
          color:#cfd8e3; background:#000a; padding:1px 6px; border-radius:5px; }
  #empty { padding:48px 16px; color:var(--dim); }
  kbd { background:#1d242e; border:1px solid var(--line); border-radius:4px;
        padding:1px 6px; font-size:12px; }
</style>

<header>
  <h1>finseg 검토</h1>
  <span class="stat" id="stat">…</span>
  <span style="flex:1"></span>
  <span class="stat">클릭 = <b style="color:var(--notfin)">지느러미 아님</b> →
    <b style="color:var(--fix)">교정 필요</b> → 통과 &nbsp;·&nbsp;
    <kbd>Enter</kbd> 저장하고 다음 &nbsp; <kbd>u</kbd> 되돌리기</span>
  <button class="primary" onclick="save()">저장하고 다음 (Enter)</button>
</header>

<div id="grid"></div>
<div id="empty" hidden></div>

<script>
const CYCLE = ["ok", "not_fin", "fix"];
const LABEL = {ok:"", not_fin:"아님", fix:"교정"};
let tiles = [], clicks = [];

async function load() {
  const r = await fetch("/api/batch?n=24").then(r => r.json());
  tiles = r.tiles; clicks = [];
  const g = document.getElementById("grid");
  g.innerHTML = "";
  document.getElementById("empty").hidden = tiles.length > 0;
  if (!tiles.length) {
    document.getElementById("empty").textContent =
      "검토할 것이 없다. 마스크가 아직 없으면 finseg.segment 를 먼저 돌릴 것.";
  }
  for (const t of tiles) {
    const d = document.createElement("div");
    d.className = "tile"; d.dataset.v = "ok"; d.dataset.box = t.box_id;
    const pts = t.points.map(p => p.join(",")).join(" ");
    d.innerHTML =
      `<img src="${t.crop}" loading="lazy" alt="">` +
      (pts ? `<svg viewBox="0 0 ${t.size} ${t.size}" preserveAspectRatio="none">
                <polygon points="${pts}"></polygon></svg>` : "") +
      `<span class="badge"></span>` +
      (t.conf != null ? `<span class="conf">${t.conf.toFixed(2)}</span>` : "");
    d.onclick = () => cycle(d);
    g.appendChild(d);
  }
  stat();
}

function cycle(d) {
  const i = CYCLE.indexOf(d.dataset.v);
  d.dataset.v = CYCLE[(i + 1) % CYCLE.length];
  d.querySelector(".badge").textContent = LABEL[d.dataset.v];
  clicks.push(d);
}

async function save() {
  if (!tiles.length) return;
  const items = tiles.map(t => ({
    box_id: t.box_id, mask_id: t.mask_id,
    verdict: document.querySelector(`.tile[data-box="${t.box_id}"]`).dataset.v,
  }));
  const r = await fetch("/api/review", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({items}),
  }).then(r => r.json());
  if (r.error) { alert(r.error); return; }
  load();
}

async function stat() {
  const p = await fetch("/api/progress").then(r => r.json());
  const done = (p["판정:ok"]||0) + (p["판정:not_fin"]||0) + (p["판정:fix"]||0);
  document.getElementById("stat").innerHTML =
    `<b>${done.toLocaleString()}</b> / ${(p["상자"]||0).toLocaleString()} 검토 ` +
    `&nbsp;·&nbsp; 통과 <b>${(p["판정:ok"]||0).toLocaleString()}</b>` +
    `&nbsp; 아님 <b>${(p["판정:not_fin"]||0).toLocaleString()}</b>` +
    `&nbsp; 교정 <b>${(p["판정:fix"]||0).toLocaleString()}</b>` +
    (p["마스크없음"] ? `&nbsp;·&nbsp; 마스크없음 ${p["마스크없음"].toLocaleString()}` : "");
}

addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); save(); }
  if (e.key === "u" && clicks.length) {
    const d = clicks.pop();
    // 되돌리기는 한 칸 뒤로 — 다시 눌러 지나친 것을 무르는 데 쓴다
    const i = CYCLE.indexOf(d.dataset.v);
    d.dataset.v = CYCLE[(i + CYCLE.length - 1) % CYCLE.length];
    d.querySelector(".badge").textContent = LABEL[d.dataset.v];
  }
});

load();
</script>
